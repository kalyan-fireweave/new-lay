metrics:
  - name: http.server.requests
    kind: counter
    signal: app
    description: HTTP requests handled by the API, including 4xx and 5xx.
  - name: http.server.request.duration
    kind: histogram
    unit: ms
    signal: app
    description: Handler time in milliseconds.
  - name: keel.card.created
    kind: counter
    signal: app
    description: Cards saved by POST /cards.
  - name: keel.card.moved
    kind: counter
    signal: app
    description: Cards whose column changed.
  - name: keel.comment.created
    kind: counter
    signal: app
    description: Comments saved on a card.
  - name: keel.card.starred
    kind: counter
    signal: app
    description: First time a person stars a card.
  - name: keel.card.duplicated
    kind: counter
    signal: app
    description: Cards saved by POST /cards/:id/duplicate.
  - name: keel.card.duplicate.rejected
    kind: counter
    signal: app
    description: Duplicate requests the API refused.
  - name: keel.card.duplicate.failed
    kind: counter
    signal: app
    description: Duplicate requests that failed inside the API.
  - name: keel.pulse.recorded
    kind: counter
    signal: app
    description: Pulses saved on the application account by POST /pulse.
  - name: keel.pulse.rejected
    kind: counter
    signal: app
    description: Pulse requests the API refused.
  - name: keel.pulse.failed
    kind: counter
    signal: app
    description: Pulse requests that failed before the machine count was saved.
  - name: keel.pulse.machines
    kind: counter
    signal: infra
    description: Pulses saved on the infrastructure account, with no run id.
  - name: keel.card.assigned
    kind: counter
    signal: app
    description: Cards assigned by POST /cards/:id/assignee.
  - name: keel.card.assign.rejected
    kind: counter
    signal: app
    description: Assign requests the API refused.
  - name: keel.card.assign.failed
    kind: counter
    signal: app
    description: Assign requests that failed before the machine count was saved.
  - name: keel.card.assign.machines
    kind: counter
    signal: infra
    description: Assignments saved on the infrastructure account, with no run id.
